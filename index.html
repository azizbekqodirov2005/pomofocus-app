<!doctype html>
<html lang="uz" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fokus" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Fokus — Pomodoro texnikasi bilan vaqtni boshqarish uchun sodda va aniq taymer. Vazifalar, kunlik statistika, uch tilli interfeys."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Fokus — Pomodoro Timer</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('fokus.theme');
          var mode = stored ? JSON.parse(stored) : 'system';
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var lang = localStorage.getItem('fokus.language');
          if (lang) document.documentElement.lang = JSON.parse(lang);
        } catch (e) {
          /* storage unavailable — fall back to the markup defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
